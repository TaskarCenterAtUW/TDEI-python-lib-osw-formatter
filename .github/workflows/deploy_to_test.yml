name: Publish to Test.PyPI.org

on:
  push:
    branches:
      - develop

jobs:
  publish:
    environment:
      name: Development
    name: Publish distribution 📦 to Test PyPI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Installing python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Updating Ubuntu
        run: sudo apt-get update

      - name: Install GDAL development
        run: sudo apt-get install -y gdal-bin libgdal-dev

      - name: Installing git
        run: pip install gitpython

      - name: Installing GDAL Package
        run: python -m pip install "GDAL==$(gdal-config --version)"

      - name: Installing Packages
        run: pip install -r requirements.txt

      - name: Verify GDAL Python bindings
        run: python -c "from osgeo import gdal, ogr; print(gdal.VersionInfo('--version'))"

      - name: Generating version file
        run: python freeze_version.py

      - name: Setup python wheel
        run: pip install wheel

      - name: Building Package
        run: python setup.py bdist_wheel

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
